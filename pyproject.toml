[project]
name = "trabalho-bb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "mfrc522>=0.0.7",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "rpi-gpio>=0.7.1",
    "spidev>=3.8",
    "validate-docbr>=1.3.0",
]

[project.scripts]
trabalho-bb = "trabalho_bb:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
python_files = ["test_*.py"]