services:
  trabalho-bb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.13"
        UV_VERSION: "0.13.7"

    container_name: trabalho-bb
    restart: unless-stopped
    init: true
    privileged: true

    volumes:
      - ./data:/data

    environment:
      PYTHONUNBUFFERED: "1"